<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6c4cf1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קוראים בכיף">
<title>קוראים בכיף – חי אפליקציות</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#6c4cf1;--pri2:#9b7bff;--ok:#1fb26b;--bad:#ff5d6c;--warn:#ffa41b;--txt:#2d2350;--mut:#8a84a3;--sh:0 6px 22px rgba(80,50,160,.13);--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Rubik,system-ui,sans-serif;background:linear-gradient(180deg,#fff7e8 0%,#f1ebff 100%);color:var(--txt);min-height:100vh;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;padding:14px 14px 90px}
button{font-family:inherit;cursor:pointer;border:0}
input,select,textarea{font-family:inherit;font-size:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.brand{font-weight:800;font-size:22px;color:var(--pri)}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.ibtn{background:#fff;border-radius:16px;padding:10px 14px;font-size:15px;font-weight:600;color:var(--txt);box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:#fff;border-radius:18px;padding:14px 18px;font-size:17px;font-weight:700;box-shadow:0 6px 0 #4b30c4;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #4b30c4}
.btn.ok{background:var(--ok);box-shadow:0 6px 0 #138a50}
.btn.warn{background:var(--warn);box-shadow:0 6px 0 #d6840a}
.btn.bad{background:var(--bad);box-shadow:0 6px 0 #d63a4a}
.btn.ghost{background:#fff;color:var(--txt);box-shadow:0 6px 0 #dcd5f3}
.btn.full{width:100%}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:14px}
.card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kid{background:#fff;border-radius:var(--r);padding:16px 10px;text-align:center;box-shadow:var(--sh);position:relative}
.av{width:92px;height:92px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#ffe29a,#ffb3c6);overflow:hidden;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:120px;height:120px;font-size:66px}
.av.sm{width:48px;height:48px;font-size:26px;margin:0;border-width:2px}
.kname{font-weight:800;font-size:19px}
.kmeta{font-size:13px;color:var(--mut);margin-top:3px}
.pts{display:inline-block;background:#fff4d6;color:#b57400;border-radius:12px;padding:3px 10px;font-weight:700;font-size:14px;margin-top:6px}
.addkid{border:3px dashed #cfc5f5;background:transparent;box-shadow:none;color:var(--pri);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px;border-radius:var(--r)}
.hero{text-align:center;padding:6px 0 10px}
.hero h2{margin:6px 0 2px;font-size:26px}
.bar{height:16px;background:#ece7fb;border-radius:10px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb020,#ff6fa3);border-radius:10px;transition:width .6s}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut);font-size:14px}
.world{margin:18px 0 8px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.lvl{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--sh);width:100%;text-align:right;color:var(--txt)}
.lvl .num{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:#ece7fb}
.lvl.done .num{background:#d4f5e4}
.lvl.cur{outline:3px solid var(--pri);}
.lvl.cur .num{background:var(--pri);color:#fff;animation:pulse 1.6s infinite}
.lvl.lock{opacity:.5}
.lvl .t{font-weight:700;font-size:16px}
.lvl .d{font-size:13px;color:var(--mut)}
.dots{display:flex;gap:4px;margin-top:4px}
.dots b{width:10px;height:10px;border-radius:50%;background:#e2dcf7}
.dots b.on{background:var(--ok)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(108,76,241,.5)}50%{box-shadow:0 0 0 10px rgba(108,76,241,0)}}
/* practice */
.pbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pdots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
.pdots b{width:12px;height:12px;border-radius:50%;background:#e2dcf7}
.pdots b.ok{background:var(--ok)}.pdots b.no{background:var(--warn)}.pdots b.cur{background:var(--pri);transform:scale(1.25)}
.read{background:#fff;border-radius:28px;padding:28px 16px;box-shadow:var(--sh);text-align:center;min-height:190px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;line-height:1.7;font-family:'Frank Ruhl Libre',Rubik,serif;font-weight:700;position:relative}
.read .w{display:inline-block;padding:0 4px;border-radius:10px;transition:background .25s,color .25s}
.read .w.ok{color:var(--ok);background:#e2f8ec}
.read .w.miss{color:var(--bad);background:#ffe8ea}
.read .w small.said{display:block;font-family:Rubik,sans-serif;font-size:max(12px,.36em);font-weight:600;color:#c0392b;line-height:1.2;margin-top:-4px}
.score{display:inline-block;background:#efe9ff;color:var(--pri);border-radius:14px;padding:4px 12px;font-weight:800;margin:6px 0}
.read .w.mark{background:#ffe066;color:var(--txt);box-shadow:0 4px 0 #ffb020;transform:scale(1.12)}
.read .w.past{color:#b8b2cc}
.read.tele{display:block;text-align:right;max-height:52vh;overflow-y:auto;scroll-behavior:smooth;padding:26px 18px;line-height:2.2}
.read .w{transition:background .2s,color .2s,transform .2s,box-shadow .2s}
.heard{min-height:22px;text-align:center;color:var(--mut);font-size:14px;margin:10px 0}
.micwrap{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 6px}
.mic{width:104px;height:104px;border-radius:50%;background:linear-gradient(135deg,#ff6fa3,#ff9f43);color:#fff;font-size:46px;box-shadow:0 8px 0 #d65a7d,0 10px 25px rgba(255,111,163,.4)}
.mic:active{transform:translateY(5px);box-shadow:0 3px 0 #d65a7d}
.mic.on{background:linear-gradient(135deg,#ff3d6e,#ff5d6c);animation:micp 1s infinite}
@keyframes micp{0%,100%{box-shadow:0 8px 0 #c42a52,0 0 0 0 rgba(255,61,110,.55)}50%{box-shadow:0 8px 0 #c42a52,0 0 0 18px rgba(255,61,110,0)}}
.side{width:60px;height:60px;border-radius:50%;background:#fff;font-size:26px;box-shadow:var(--sh);color:var(--txt)}
.side small{display:block;font-size:10px;font-weight:600}
.fb{text-align:center;min-height:70px;margin-top:6px}
.fb .big{font-size:26px;font-weight:800}
.fb .stars{font-size:34px;letter-spacing:4px}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.plusp{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:54px;font-weight:800;color:#ffb020;text-shadow:0 3px 0 #fff,0 6px 18px rgba(0,0,0,.2);pointer-events:none;animation:fly 1.3s forwards;z-index:60}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.parentrow{display:flex;gap:10px;justify-content:center;margin-top:10px}
.linkbtn{background:none;color:var(--mut);font-size:13px;text-decoration:underline;padding:6px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(30,20,60,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:26px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto;animation:pop .35s}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2d2350;color:#fff;padding:12px 18px;border-radius:16px;font-size:15px;z-index:70;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55}
/* settings */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tab{background:#fff;border-radius:14px;padding:9px 13px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--txt);box-shadow:var(--sh)}
.tab.on{background:var(--pri);color:#fff}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
.in{width:100%;border:2px solid #e4def7;border-radius:14px;padding:11px 12px;background:#fff;color:var(--txt)}
.in:focus{outline:none;border-color:var(--pri)}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0ecfb}
.li:last-child{border:0}
.x{background:#ffe8ea;color:var(--bad);border-radius:12px;padding:7px 10px;font-weight:700}
.emo-pick{display:flex;flex-wrap:wrap;gap:6px}
.emo-pick button{font-size:26px;background:#f5f2ff;border-radius:12px;width:46px;height:46px}
.emo-pick button.on{background:var(--pri2)}
.seg{display:flex;background:#f0ecfb;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;background:none;border-radius:11px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--txt)}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);color:var(--pri)}
/* wheel */
.wheelbox{position:relative;width:310px;height:310px;margin:10px auto}
.wheelbox canvas{width:310px;height:310px;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:42px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));z-index:2}
.warnbox{background:#fff3d6;border-radius:16px;padding:10px 12px;font-size:13px;margin-bottom:12px;color:#7a5200}
.tq{background:#fff;border-radius:26px;padding:16px;box-shadow:var(--sh);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.tqt{font-size:24px;font-weight:700;line-height:1.5}.tqt b{font-family:'Frank Ruhl Libre',serif;color:var(--pri);font-size:32px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.tiles.four{grid-template-columns:1fr 1fr}
.tile{background:#fff;border-radius:24px;min-height:120px;box-shadow:0 6px 0 #e4ddf7,var(--sh);display:flex;align-items:center;justify-content:center;padding:8px}
.tile:active{transform:translateY(3px)}
.tile.right{background:#d4f5e4;box-shadow:0 6px 0 #9fe0bd;animation:pop .45s}.tile.wrong{opacity:.3;animation:shake .4s}
.dot{display:inline-block;width:74px;height:74px;border-radius:50%;border:3px solid rgba(0,0,0,.1)}
.shp{width:80px;height:80px}.emo{font-size:60px;line-height:1}.pic{width:100px;height:100px;object-fit:contain;display:block;margin:0 auto}.lvis{display:flex;flex-direction:column;justify-content:center;align-items:center}.mic:not(.on){transform:none!important;filter:none!important}.mic.wait{background:#b9b4cc;box-shadow:0 8px 0 #9a94b3;animation:none}.mic.go{background:linear-gradient(135deg,#22c55e,#12a150);box-shadow:0 8px 0 #0e7f3f;animation:micg 1s infinite}@keyframes micg{0%,100%{box-shadow:0 8px 0 #0e7f3f,0 0 0 0 rgba(34,197,94,.55)}50%{box-shadow:0 8px 0 #0e7f3f,0 0 0 18px rgba(34,197,94,0)}}.dig{font-size:64px;font-weight:800;color:var(--pri)}
.let{font-family:'Frank Ruhl Libre',serif;font-size:74px;font-weight:700;color:var(--pri);line-height:1}
.cntv{font-size:44px;letter-spacing:6px;line-height:1.35;max-width:320px}
.learn{text-align:center;padding:26px 16px;cursor:pointer}.lvis{transform:scale(1.7);margin:34px 0 30px}.lname{font-family:'Frank Ruhl Libre',serif;font-size:50px;font-weight:700}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<script>
/* ================= קוראים בכיף – חי אפליקציות ================= */
const APP_VER='__APP_VERSION__';
const NAT=(()=>{try{const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()?C:null;}catch(e){return null;}})();
function natP(n){try{if(!NAT)return null;NAT.Plugins=NAT.Plugins||{};if(NAT.Plugins[n])return NAT.Plugins[n];if(NAT.registerPlugin){const p=NAT.registerPlugin(n);NAT.Plugins[n]=p;return p;}}catch(e){}return null;}
const KS=natP('KriahSpeech'),NTTS=natP('TextToSpeech'),UPD=natP('Updater');
const KEY='kriah_v1';
const LEVELS=[
 {id:'n1',w:3,emo:'🅰️',title:'קָמָץ וּפַתָּח',desc:'הברות עם תנועת "אָ"',type:'syll',pts:1,n:8,items:['בָּ','מָ','לָ','דָּ','גַּ','נַ','סָ','רַ','תָּ','פָּ','כָּ','שָׁ','הַ','זָ','טַ','יָ']},
 {id:'n2',w:3,emo:'🅴',title:'חִירִיק, צֵירֵה וְסֶגּוֹל',desc:'הברות עם "אִי" ו"אֶה"',type:'syll',pts:1,n:8,items:['בִּי','מִי','לֵ','דֶּ','נִי','סֵ','רֶ','תִּי','גֵּ','שֶׁ','הִי','כֶּ','פִּי','זֵ']},
 {id:'n3',w:3,emo:'🅾️',title:'חוֹלָם, שׁוּרוּק וְקֻבּוּץ',desc:'הברות עם "אוֹ" ו"אוּ"',type:'syll',pts:1,n:8,items:['בּוֹ','מוּ','לֹ','דֻּ','נוֹ','סוּ','רֹ','תּוּ','גּוֹ','שׁוּ','כֹּ','פּוּ','זוֹ','חוּ']},
 {id:'n4',w:3,emo:'🐟',title:'מִלִּים רִאשׁוֹנוֹת',desc:'מילים פשוטות וקצרות',type:'word',pts:2,n:6,items:['אַבָּא','אִמָּא','יָד','דָּג','גַּן','סַל','בַּיִת','כֶּלֶב','חָתוּל','סוּס','דֹּב','פִּיל','שֶׁמֶשׁ','יָם','עֵץ','פֶּרַח','בָּנָנָה','תַּפּוּחַ','כּוֹס','מַיִם']},
 {id:'n5',w:3,emo:'🦋',title:'מִלִּים עִם שְׁוָא וְדָגֵשׁ',desc:'מילים ארוכות יותר',type:'word',pts:3,n:6,items:['שְׁמָלָה','סְפָרִים','מְכוֹנִית','תְּמוּנָה','מִטְבָּח','שֻׁלְחָן','כִּסֵּא','מַחְבֶּרֶת','יְלָדִים','פַּרְפַּר','צְפַרְדֵּעַ','מִשְׁפָּחָה','גְּלִידָה','עִפָּרוֹן','אוֹפַנַּיִם','מַטְרִיָּה']},
 {id:'n6',w:3,emo:'✌️',title:'שְׁתֵּי מִלִּים',desc:'צירופים קצרים',type:'phrase',pts:4,n:5,items:['יֶלֶד טוֹב','בַּיִת גָּדוֹל','כֶּלֶב קָטָן','שֶׁמֶשׁ חַמָּה','סֵפֶר חָדָשׁ','גַּן יָפֶה','אַבָּא שֶׁלִּי','יוֹם שָׂמֵחַ','תַּפּוּחַ אָדֹם','פֶּרַח צָהֹב']},
 {id:'n7',w:3,emo:'🤟',title:'שָׁלוֹשׁ מִלִּים',desc:'משפטונים',type:'phrase',pts:5,n:5,items:['הַיֶּלֶד קוֹרֵא סֵפֶר','אִמָּא אוֹפָה עוּגָה','הַחָתוּל שׁוֹתֶה חָלָב','אֲנִי אוֹהֵב לִקְרֹא','הַכֶּלֶב רָץ מַהֵר','אַבָּא נוֹסֵעַ לָעֲבוֹדָה','הַשֶּׁמֶשׁ זוֹרַחַת בַּבֹּקֶר','דָּנִי מְשַׂחֵק בַּגַּן']},
 {id:'s1',w:4,emo:'📝',title:'מִשְׁפָּט קָצָר',desc:'קריאה שוטפת של משפט',type:'sentence',pts:8,n:4,items:['הַיּוֹם אֲנִי הוֹלֵךְ לַגַּן עִם אַבָּא.','הַצִּפּוֹר שָׁרָה שִׁיר יָפֶה עַל הָעֵץ.','אֲנִי אוֹכֵל תַּפּוּחַ אָדֹם וּמָתוֹק.','הַיְּלָדִים מְשַׂחֲקִים בַּכַּדּוּר בֶּחָצֵר.','סַבְתָּא אוֹפָה עוּגָה טְעִימָה לְשַׁבָּת.','בַּלַּיְלָה הַיָּרֵחַ מֵאִיר בַּשָּׁמַיִם.','הַכֶּלֶב שֶׁלִּי אוֹהֵב לָרוּץ בַּגִּנָּה.']},
 {id:'s2',w:4,emo:'📜',title:'מִשְׁפָּט אָרֹךְ',desc:'משפטים ארוכים בקצב נכון',type:'sentence',pts:12,n:3,items:['בְּכָל בֹּקֶר אֲנִי קָם, נוֹטֵל יָדַיִם, אוֹמֵר מוֹדֶה אֲנִי וְהוֹלֵךְ לְבֵית הַסֵּפֶר שָׂמֵחַ.','בַּחֹרֶף יוֹרֵד גֶּשֶׁם חָזָק, וְכָל הַיְּלָדִים לוֹבְשִׁים מְעִילִים וּמַגָּפַיִם.','אַבָּא וְאִמָּא לָקְחוּ אוֹתָנוּ לְטִיּוּל בַּיַּעַר, וְרָאִינוּ שָׁם צְבִי קָטָן וְהַרְבֵּה פְּרָחִים.','בְּשַׁבָּת כָּל הַמִּשְׁפָּחָה יוֹשֶׁבֶת יַחַד סְבִיב הַשֻּׁלְחָן וְשָׁרָה שִׁירִים יָפִים.']},
 {id:'s3',w:4,emo:'🏆',title:'סִפּוּר שָׁלֵם',desc:'קריאת סיפור מההתחלה עד הסוף',type:'story',pts:25,n:1,items:['גּוּר קָטָן הָלַךְ לְאִבּוּד בַּפַּארְק. הוּא חִפֵּשׂ אֶת אִמָּא שֶׁלּוֹ בְּכָל מָקוֹם. יַלְדָּה טוֹבָה רָאֲתָה אוֹתוֹ וְעָזְרָה לוֹ. בַּסּוֹף הַגּוּר מָצָא אֶת אִמָּא, וְכֻלָּם הָיוּ שְׂמֵחִים.','בַּגִּנָּה שֶׁלָּנוּ שָׁתַלְנוּ עֵץ קָטָן. כָּל יוֹם הִשְׁקֵינוּ אוֹתוֹ בְּמַיִם. הָעֵץ גָּדַל וְגָדַל עַד שֶׁהָיָה גָּבוֹהַּ מִמֶּנִּי. עַכְשָׁו יֵשׁ לוֹ תַּפּוּחִים מְתוּקִים לְכָל הַמִּשְׁפָּחָה.']}
];

const NQ=/[֑-ׇ]/g;const FIN={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function norm(s){return String(s||'').replace(NQ,'').replace(/[ךםןףץ]/g,c=>FIN[c]).replace(/[^א-ת\s]/g,' ').replace(/\s+/g,' ').trim();}
function wordsOf(s){const n=norm(s);return n?n.split(' '):[];}
function skel(w){return w.replace(/[וי]/g,'');}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function weq(a,b){if(a===b)return true;const sa=skel(a),sb=skel(b);if(sa.length>=2&&sa===sb)return true;if(sa.length>=4&&sb.length>=4&&lev(sa,sb)<=1)return true;return false;}
function align(T,Sp){const n=T.length,m=Sp.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=weq(T[i],Sp[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const ok=new Array(n).fill(false);let i=0,j=0;
 while(i<n&&j<m){if(weq(T[i],Sp[j])&&dp[i][j]===dp[i+1][j+1]+1){ok[i]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
 return ok;}

   ומילה נחשבת נכונה רק אם מה שנשמע הוא אחד מהם. ו׳/י׳ שנוספו או חסרו במקום שהניקוד לא מאפשר = טעות קריאה. */
const PH={'ע':'א','ח':'כ','ט':'ת','ק':'כ'};
const phon=w=>w.replace(/[עחטק]/g,c=>PH[c]);
const EXTRA_FORMS={'עכשו':['עכשיו'],'מצוה':['מצווה'],'תקוה':['תקווה'],'ירושלמ':['ירושלים'],'אלהימ':['אלוהים','אלוקים'],'אלהינו':['אלוהינו','אלוקינו'],'אלהי':['אלוהי','אלוקי']};
const HASHEM=['אדוני','אדני','השמ','ה','יהוה','הוויה'];
function wordForms(tok){
 const bare=norm(tok).replace(/\s/g,'');if(/^[ולבכמשה]?יהוה$/.test(bare)||bare==='יי'){const pre=bare.length>4?bare[0]:'';const st=new Set(HASHEM.map(x=>phon(pre+x)).concat(HASHEM.map(phon)));return st;}
 const units=[];for(const ch of tok){if(/[א-ת]/.test(ch))units.push({l:FIN[ch]||ch,m:''});else if(/[֑-ׇ]/.test(ch)&&units.length)units[units.length-1].m+=ch;}
 if(!units.length)return null;let forms=[''];const n=units.length;
 units.forEach((u,i)=>{const m=u.m,has=c=>m.indexOf(c)>=0,next=units[i+1];let base=[u.l],ins=[''];
  const vowel=/[ְ-ׇֻ]/.test(m);
  if(u.l==='ש'&&has('ׂ'))base=['ש','ס'];
  if(u.l==='ו'){if(!has('ֹ')&&!(has('ּ')&&!vowel)&&vowel&&i>0&&i<n-1)base=['ו','וו'];}
  else if(u.l==='י'){if((vowel||has('ּ'))&&i>0&&i<n-1)base=['י','יי'];}
  else{if(has('ֹ')||has('ֻ')||has('ֳ')||has('ׇ'))ins=['','ו'];
   else if((has('ִ')||has('ֵ'))&&!(next&&next.l==='י'))ins=['','י'];
   else if(has('ָ')&&next&&next.m.indexOf('ְ')>=0&&i<n-2)ins=['','ו'];}
  const out=[];forms.forEach(f=>base.forEach(b=>ins.forEach(x=>out.push(f+b+x))));forms=out.slice(0,128);});
 if(/כ\u05BC?\u05B8ל(?![\u05B0-\u05BC\u05C1\u05C2\u05D0-\u05EA])/.test(tok))forms=forms.concat(forms.map(f=>f.replace(/כל$/,'כול')));

 (EXTRA_FORMS[bare.replace(/^[ולבכמשה]/,'')]||[]).forEach(x=>forms.push((bare.length>x.length-1&&EXTRA_FORMS[bare]?'':bare[0])+x));(EXTRA_FORMS[bare]||[]).forEach(x=>forms.push(x));

function weqStrict(T,w){if(T.kol&&/קו?ל$/.test(w))return false;return T.has(phon(w));}
function alignWith(T,Sp,eq){const n=T.length,m=Sp.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=eq(T[i],Sp[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const ok=new Array(n).fill(false),pairs=[];let i=0,j=0;
 while(i<n&&j<m){if(eq(T[i],Sp[j])&&dp[i][j]===dp[i+1][j+1]+1){ok[i]=true;pairs.push([i,j]);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
 const said={};let pi=-1,pj=-1;pairs.concat([[n,m]]).forEach(([a,b])=>{for(let k=0;pi+1+k<a&&pj+1+k<b;k++)said[pi+1+k]=Sp[pj+1+k];pi=a;pj=b;});

function evalItem(text,finals,interim){

 const inter=interim||'';const cands=[finals.map(a=>a[0]).join(' ')+' '+inter];
 finals.forEach(a=>a.slice(1).forEach(alt=>cands.push(finals.map(b=>b===a?alt:b[0]).join(' ')+' '+inter)));
 let best={ok:new Array(T.length).fill(false),cnt:-1,said:{}};
 cands.slice(0,40).forEach(c=>{const r=alignWith(T,wordsOf(c),weqStrict);const cnt=r.ok.filter(Boolean).length;if(cnt>best.cnt)best={ok:r.ok,cnt,said:r.said};});

 const cnt=Math.max(0,best.cnt);return{okTok,saidTok,cnt,total:T.length,acc:T.length?cnt/T.length:1};}

async function aSet(k,v){const d=await db();return new Promise(r=>{const t=d.transaction('a','readwrite');if(v)t.objectStore('a').put(v,k);else t.objectStore('a').delete(k);t.oncomplete=()=>r();t.onerror=()=>r();});}
async function aKeys(){try{const d=await db();return await new Promise(r=>{const q=d.transaction('a').objectStore('a').getAllKeys();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([]);});}catch(e){return[];}}
let curAudio=null,playTok=0;
function playOne(t,cheer,tok){return new Promise(async res=>{let done=false;const fin=()=>{if(!done){done=true;res();}};
 const b=await aGet(String(t).trim());if(tok!==playTok)return fin();
 if(b){curAudio=new Audio(URL.createObjectURL(b));curAudio.onended=fin;curAudio.onerror=fin;curAudio.play().catch(fin);setTimeout(fin,15000);return;}
 if(!NTTS&&!('speechSynthesis'in window))return fin();
 if(!cheer&&!playOne._w){playOne._w=1;toast('🔈 קול ממוחשב – להגייה מדויקת הקליטו בהגדרות ← הקלטות');}
 if(NTTS){NTTS.speak({text:ttsFix(cheer?ttsGender(SPOKEN[t]||t):(SPOKEN[t]||t)),lang:'he-IL',rate:cheer?1.0:.85,pitch:cheer?1.25:1.0,volume:1.0}).then(fin,fin);setTimeout(fin,Math.max(4000,String(t).length*200));return;}
 const u=new SpeechSynthesisUtterance(ttsFix(cheer?ttsGender(SPOKEN[t]||t):(SPOKEN[t]||t)));u.lang='he-IL';u.rate=cheer?1.02:.8;u.pitch=cheer?1.3:1;const v=speechSynthesis.getVoices().find(v=>/he|iw/i.test(v.lang));if(v)u.voice=v;
 u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);setTimeout(fin,Math.max(3000,String(t).length*180));});}
async function playSeq(list,cheer){const tok=++playTok;try{if(NTTS)NTTS.stop().catch(()=>{});else speechSynthesis.cancel();}catch(e){}if(curAudio){curAudio.pause();curAudio=null;}
 for(const t of list){if(!t)continue;if(tok!==playTok)return;await playOne(t,cheer,tok);}}
function stopSpeak(){playTok++;try{if(NTTS)NTTS.stop().catch(()=>{});else speechSynthesis.cancel();}catch(e){}if(curAudio){try{curAudio.pause();}catch(e){}curAudio=null;}}
function playItem(t,cheer){return playSeq([t],cheer);}
function cheerSay(list){return S.settings.voice?playSeq(list,true):Promise.resolve();}

function goalCur(k){return S.settings.goalType==='minutes'?Math.floor((k.goalSec||0)/60):(k.goalPts||0);}
function goalPct(k){return Math.min(100,Math.round(goalCur(k)/Math.max(1,S.settings.goalTarget)*100));}
function goalReached(k){return goalCur(k)>=S.settings.goalTarget;}
function goalLabel(k){const u=S.settings.goalType==='minutes'?'דקות':'נקודות';return `${Math.min(goalCur(k),S.settings.goalTarget)} / ${S.settings.goalTarget} ${u}`;}

 const pre=L.id+'|';const mist=Object.keys(k.mist||{}).filter(x=>x.startsWith(pre)).map(x=>x.slice(pre.length)).filter(t=>names.includes(t));
 const n=Math.min(lengthN(L.n),names.length);const pick=shuffle(mist).slice(0,Math.ceil(n/2));

/* --- הקשבה חכמה לתשובה קצרה (צבע, צורה, חיה, אות, מספר):

function sayScore(alts,o,L){const items=L&&L.type==='tap'?L.items:[o];const num=o.cnt||o.num;let best=null;

  const n=norm(a);if(!n)continue;const ws=n.split(' ');const cands=new Set([n.replace(/\s/g,'')].concat(ws).concat(ws.map(w=>w.replace(/^[הו]/,''))));
  for(const c of cands){const cs=skw(c);if(!cs)continue;for(const x of items){for(const f of [sayName(x.name),plain(x.name)]){const fs=skw(f);if(!fs)continue;
   const d=cs===fs?0:(cs.includes(fs)&&fs.length>=2?0.1:lev(cs,fs)/Math.max(fs.length,cs.length));if(!best||d<best.d)best={d,x,heard:a};}}}}

let wAng=0,spinning=false;
function wheelHTML(){const k=kidById(curKid);const gr=goalReached(k);
 return `<div class="top"><button class="ibtn" onclick="go('kid')">➜ חזרה</button>${avatar(k,'sm')}</div>
 <div class="hero"><h2>🎡 גלגל המזל של ${esc(k.name)}</h2><div class="mut">${gr?G('לחץ על "סובב" וגלה מה זכית!','לחצי על "סובבי" וגלי מה זכית!'):G('עוד לא הגעת ליעד – המשך לקרוא! 📖','עוד לא הגעת ליעד – המשיכי לקרוא! 📖')}</div></div>

 <button class="btn warn full" style="font-size:22px;padding:18px" id="spinBtn" ${gr?'':'disabled style="opacity:.5"'} onclick="spin()">${G('🎰 סובב!','🎰 סובבי!')}</button>
 ${(k.prizes||[]).length?`<div class="card" style="margin-top:16px"><b>🎁 הפרסים שזכיתי בהם</b>${k.prizes.slice(-8).reverse().map(p=>`<div class="li"><span>${esc(p.t)}</span><span class="sp"></span><span class="mut">${new Date(p.d).toLocaleDateString('he-IL')}</span></div>`).join('')}</div>`:''}`;}
function drawWheel(a){const c=$('wheel');if(!c)return;const x=c.getContext('2d');const P2=S.settings.prizes.length?S.settings.prizes:['🎁 הפתעה'];const n=P2.length,R=310,seg=Math.PI*2/n;
 x.clearRect(0,0,620,620);x.save();x.translate(310,310);x.rotate(a);
 for(let i=0;i<n;i++){x.beginPath();x.moveTo(0,0);x.arc(0,0,R,i*seg,(i+1)*seg);x.closePath();x.fillStyle=WCOL[i%WCOL.length];x.fill();x.strokeStyle='#fff';x.lineWidth=4;x.stroke();
  x.save();x.rotate(i*seg+seg/2);x.textAlign='right';x.textBaseline='middle';x.fillStyle='#fff';x.font='bold '+(n>8?24:30)+'px Rubik,sans-serif';x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=4;
  let t=P2[i];if(t.length>14)t=t.slice(0,13)+'…';x.fillText(t,R-20,0);x.restore();}
 x.beginPath();x.arc(0,0,44,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.font='44px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('⭐',0,3);x.restore();}
function spin(){const k=kidById(curKid);if(spinning||!goalReached(k))return;spinning=true;ac();$('spinBtn').disabled=true;
 const pr=S.settings.prizes.length?S.settings.prizes:['🎁 הפתעה'];const n=pr.length,seg=Math.PI*2/n;const win=Math.floor(Math.random()*n);
 // pointer at top (-PI/2). segment center = win*seg+seg/2 ; need a+center = -PI/2 (mod 2PI)
 let target=-Math.PI/2-(win*seg+seg/2)+(Math.random()-.5)*seg*.6;const base=wAng%(Math.PI*2);let delta=target-base;while(delta<0)delta+=Math.PI*2;delta+=Math.PI*2*6;
 const from=wAng,dur=4600,t0=performance.now();let lastSeg=-1;
 function step(t){const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,4);wAng=from+delta*e;drawWheel(wAng);
  const s=Math.floor((((-Math.PI/2-wAng)%(Math.PI*2))+Math.PI*4)%(Math.PI*2)/seg);if(s!==lastSeg){lastSeg=s;SND.tick();}
  if(p<1)requestAnimationFrame(step);else{spinning=false;won(pr[win]);}}
 requestAnimationFrame(step);}
function won(prize){const k=kidById(curKid);k.prizes=k.prizes||[];k.prizes.push({t:prize,d:Date.now()});

   try{L=await UPD.addListener('progress',p=>{if(p&&p.pct>=0)b.textContent='⬇ מוריד… '+p.pct+'%';});}catch(e){}
   try{const d=await UPD.download({url:a.browser_download_url,version:v});try{L&&L.remove();}catch(e){}b.textContent='📲 פותח התקנה…';const i=await UPD.install({path:d.path});
    if(i&&i.needPermission){b.disabled=false;b.textContent='📲 התקן עכשיו';toast('אשרו "התרת התקנה מהמקור הזה", חזרו ולחצו "התקן עכשיו"');b.onclick=()=>UPD.install({path:d.path}).catch(()=>toast('ההתקנה לא נפתחה'));}}
   catch(e){try{L&&L.remove();}catch(x){}toast('ההורדה נכשלה – פותח בדפדפן');location.href=a.browser_download_url;}};
 }catch(e){if(manual)toast('אין חיבור לבדיקת עדכונים');}}
if(NAT){setTimeout(()=>checkUpdate(false),6000);setTimeout(()=>{try{UPD&&UPD.cleanup&&UPD.cleanup();}catch(e){}},12000);}
if('speechSynthesis'in window)speechSynthesis.getVoices();
render();
</script>
