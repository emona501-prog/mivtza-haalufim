<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e5fa8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מבצע האלופים">
<title>מבצע האלופים 🏆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1e5fa8;--bg2:#3fb5c9;--sun:#ffd54a;--card:#ffffff;--ink:#1f2a44;--muted:#6b7895;
  --green:#22c55e;--green2:#16a34a;--pink:#ec4899;--purple:#8b5cf6;--orange:#f97316;--radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.card{max-width:100%;overflow:hidden}
body{font-family:'Rubik','Varela Round','Segoe UI',Arial,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 50% 0%,#fff6c9 0%,#9fe3ee 35%,#3a9bd6 70%,#1e5fa8 100%) fixed;
  min-height:100vh;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer;border:none}
input,textarea,select{font-family:inherit;font-size:16px}
.app{max-width:560px;margin:0 auto;padding:12px 10px 110px;position:relative;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 4px 12px}
.brand{display:flex;align-items:center;gap:8px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.brand .logo{font-size:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.brand h1{margin:0;font-size:22px;font-weight:800}
.brand small{display:block;font-size:12px;opacity:.9;font-weight:500}
.iconbtn{background:rgba(255,255,255,.9);border-radius:14px;width:42px;height:42px;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 8px 24px rgba(16,42,90,.18);padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:19px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff;border-radius:16px;padding:12px 16px;font-size:16px;font-weight:700;box-shadow:0 4px 0 #1d4ed8,0 6px 14px rgba(37,99,235,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d4ed8}
.btn.green{background:linear-gradient(180deg,#34d399,#16a34a);box-shadow:0 4px 0 #15803d,0 6px 14px rgba(22,163,74,.35)}
.btn.pink{background:linear-gradient(180deg,#f472b6,#db2777);box-shadow:0 4px 0 #be185d,0 6px 14px rgba(219,39,119,.35)}
.btn.orange{background:linear-gradient(180deg,#fdba74,#f97316);box-shadow:0 4px 0 #c2410c,0 6px 14px rgba(249,115,22,.35)}
.btn.purple{background:linear-gradient(180deg,#a78bfa,#7c3aed);box-shadow:0 4px 0 #6d28d9,0 6px 14px rgba(124,58,237,.35)}
.btn.gray{background:#eef2f9;color:var(--ink);box-shadow:0 3px 0 #d3dbea}
.btn.red{background:linear-gradient(180deg,#f87171,#dc2626);box-shadow:0 4px 0 #b91c1c}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.block{width:100%;display:block}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef4ff;border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:14px}
/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.97);box-shadow:0 -6px 20px rgba(0,0,0,.12);border-radius:22px 22px 0 0;display:flex;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:14px;min-width:68px}
.nav button span.i{font-size:24px}
.nav button.on{color:#2563eb;background:#e8f0ff}
/* kids quick */
.kids{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px 8px;scrollbar-width:none}
.kids::-webkit-scrollbar{display:none}
.kid{flex:1 1 140px;min-width:0;background:#fff;border-radius:20px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);border:3px solid transparent;font-weight:800;font-size:16px}
.kid img,.av{border-radius:50%;object-fit:cover;background:#dbeafe}
.kid img{width:44px;height:44px}
.kid .pts{white-space:nowrap;font-size:12px;color:var(--muted);font-weight:600;display:block}
.kid.on{border-color:var(--kc,#2563eb)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead .t{text-align:center}
.calhead .t b{display:block;font-size:22px;font-weight:800}
.calhead .t span{font-size:13px;color:var(--muted)}
.calhead button{flex:0 0 auto;width:44px;height:44px;border-radius:14px;background:#eef4ff;font-size:22px;color:#2563eb;font-weight:800}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(2px,1.2vw,5px);width:100%}
.wd{min-width:0;text-align:center;font-size:clamp(11px,3.4vw,13px);font-weight:800;color:var(--muted);padding:4px 0}
.wd.sh{color:#7c3aed}
.day{min-width:0;overflow:hidden;padding-left:0;padding-right:0;min-height:clamp(46px,13vw,60px);gap:1px;border-radius:14px;background:#f4f7fd;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px 3px;position:relative;border:2px solid transparent;transition:transform .1s}
.day:active{transform:scale(.94)}
.day .h{font-size:clamp(12px,4.2vw,17px);white-space:nowrap;font-weight:800;line-height:1.1}
.day .g{font-size:clamp(8px,2.6vw,10px);color:var(--muted);line-height:1}
.day.sh{background:#f3eeff}
.day.today{border-color:#f59e0b;background:#fff7db;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.day.future{opacity:.55}
.day.empty{background:transparent}
.dots{display:flex;gap:2px;justify-content:center;min-height:9px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
.dot.star{width:auto;height:auto;background:none;font-size:9px;line-height:9px}
/* day screen */
.dayhdr{background:linear-gradient(135deg,#fff,#fff7db);text-align:center}
.dayhdr .hd{font-size:24px;font-weight:800}
.dayhdr .gd{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:18px;padding:6px 10px;border:3px solid transparent;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.1);min-width:76px}
.tab img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.tab.on{border-color:var(--kc);transform:translateY(-2px)}
.tab small{font-size:11px;color:var(--muted);font-weight:600}
.pbar{height:16px;background:#e8eef9;border-radius:999px;overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#34d399,#22c55e,#a3e635);transition:width .5s}
.pbar.gold>i{background:linear-gradient(90deg,#fbbf24,#f59e0b,#fde047)}
.hint{background:#fff7db;border:2px dashed #fbbf24;border-radius:16px;padding:8px 12px;font-weight:700;text-align:center;font-size:15px;margin:10px 0}
.task{position:relative;margin-bottom:10px;border-radius:20px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.task .under{position:absolute;inset:0;background:linear-gradient(90deg,#22c55e,#86efac);display:flex;align-items:center;padding:0 22px;color:#fff;font-size:22px;font-weight:800;justify-content:flex-end}
.task .face{position:relative;background:#fff;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;box-shadow:0 4px 14px rgba(16,42,90,.14);border-right:8px solid var(--tc,#60a5fa);transition:transform .25s cubic-bezier(.2,.9,.3,1.2),background .3s}
.task .face.drag{transition:none}
.task .txt{flex:1;font-size:17px;font-weight:700;line-height:1.3}
.task .txt small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.task .arrow{font-size:22px;color:#cbd5e1;animation:nudge 1.6s infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.task.done .face{background:linear-gradient(90deg,#ecfdf5,#d1fae5);border-right-color:var(--green)}
.task.done .txt{color:#166534}
.ticon{position:relative;width:66px;height:66px;flex:0 0 66px}
.ticon .av{width:66px;height:66px;border:3px solid var(--tc,#93c5fd)}
.ticon .em{position:absolute;bottom:-4px;left:-6px;background:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ticon .ok{position:absolute;top:-4px;right:-4px;background:var(--green);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:pop .4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.cnt{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;font-weight:800;font-size:18px;border-radius:12px;padding:6px 10px;box-shadow:0 2px 6px rgba(245,158,11,.4);animation:pop .4s}
.undo{background:#fff;border-radius:12px;width:38px;height:38px;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.perfect{text-align:center;background:linear-gradient(135deg,#fde68a,#fbbf24);border-radius:20px;padding:14px;font-weight:800;font-size:20px;color:#7c2d12;box-shadow:0 6px 18px rgba(245,158,11,.4);margin:10px 0}
/* child page */
.hero{text-align:center;position:relative;overflow:hidden}
.hero .bigav{width:120px;height:120px;border-radius:50%;object-fit:cover;border:5px solid var(--kc);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.hero h2{font-size:28px;margin:8px 0 2px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:#f4f7fd;border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.stars{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:10px 0}
.stars span{font-size:24px;filter:grayscale(1) opacity(.3);transition:.3s}
.stars span.on{filter:none;animation:pop .5s}
.prizebox{display:flex;align-items:center;gap:12px}
.prizebox img{width:96px;height:96px;object-fit:contain;border-radius:18px;background:linear-gradient(135deg,#ede9fe,#dbeafe)}
.pending{background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:18px;padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:8px;border:2px solid #f59e0b;animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}50%{box-shadow:0 0 0 8px rgba(245,158,11,0)}}
.pending img{width:54px;height:54px;object-fit:contain;border-radius:12px;background:#fff}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sd{text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.sd i{display:flex;margin:0 auto 3px;width:min(34px,9vw);height:min(34px,9vw);border-radius:50%;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:800;color:#fff}
.tstat{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;font-weight:600}
.tstat .nm{flex:0 0 42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tstat .pbar{flex:1;height:12px}
.tstat b{width:28px;text-align:center}
.hist{font-size:14px;padding:6px 0;border-bottom:1px solid #eef2f9;display:flex;justify-content:space-between;gap:8px}
/* wheel */
.wheelwrap{position:relative;width:min(88vw,360px);height:min(88vw,360px);margin:10px auto 6px}
.wheelwrap canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.3),0 0 0 8px #fff,0 0 0 14px #fbbf24}
.pointer{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:44px;z-index:3;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.hub{position:absolute;top:50%;left:50%;width:74px;height:74px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#fbbf24 60%,#d97706);border:5px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3);font-weight:800;font-size:16px;color:#7c2d12;z-index:2}
.tokens{text-align:center;font-weight:800;font-size:17px}
/* settings */
.sect{border:none;margin:0}
.lbl{font-weight:700;font-size:14px;margin:10px 0 4px;display:block}
.inp{width:100%;border:2px solid #e2e8f0;border-radius:12px;padding:10px 12px;background:#f8fafc}
.inp:focus{outline:none;border-color:#60a5fa;background:#fff}
.erow{display:flex;align-items:center;gap:6px;background:#f4f7fd;border-radius:14px;padding:6px;margin-bottom:6px}
.erow .inp{padding:8px;background:#fff}
.erow .em{width:46px;text-align:center;padding:8px 2px}
.erow .thumb{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 44px;background:#dbeafe}
.mini{background:#fff;border-radius:10px;min-width:34px;height:34px;font-size:16px;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:0 6px}
.mini.red{color:#dc2626}
.help{background:#ecfeff;border:2px solid #67e8f9;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.6}
.help b{color:#0e7490}
.imgslot{display:flex;align-items:center;gap:10px;background:#f4f7fd;border-radius:16px;padding:8px}
.imgslot img{width:72px;height:72px;border-radius:16px;object-fit:cover;background:#dbeafe}
.switch{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-weight:700}
.switch input{width:24px;height:24px}
details.card summary{font-weight:800;font-size:18px;cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary:after{content:'▾';float:left;color:var(--muted)}
details[open].card summary:after{content:'▴'}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,50,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:26px;max-width:480px;width:100%;max-height:88vh;overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:up .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes up{from{transform:translateY(40px) scale(.95);opacity:0}}
.modal h3{margin:0 0 10px;font-size:22px;text-align:center}
.celebrate{text-align:center}
.celebrate .big{font-size:64px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.celebrate img{width:180px;height:180px;object-fit:contain;border-radius:24px;margin:8px auto;display:block;background:linear-gradient(135deg,#ede9fe,#dbeafe)}
.bubble{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:90;background:linear-gradient(135deg,#fff,#fef9c3);border-radius:28px;padding:18px 26px;font-size:28px;font-weight:800;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.3);border:5px solid #fbbf24;animation:bub 2.2s forwards;pointer-events:none;max-width:90vw;color:#b45309}
@keyframes bub{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:85;width:100%;height:100%}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1f2a44;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:95;animation:fade .2s;max-width:90vw;text-align:center}
.foot{text-align:center;color:#fff;font-size:12px;opacity:.85;margin-top:8px}
.empty-msg{text-align:center;padding:20px;color:var(--muted);font-weight:600}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pinpad button{height:56px;border-radius:16px;background:#eef4ff;font-size:24px;font-weight:800}
.pindots{display:flex;justify-content:center;gap:12px;margin:10px 0}
.pindots i{width:16px;height:16px;border-radius:50%;background:#e2e8f0}
.pindots i.on{background:#2563eb}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav">
  <button data-v="home" onclick="go('home')"><span class="i">📅</span>לוח שנה</button>
  <button data-v="child" onclick="go('child')"><span class="i">🏅</span>הילדים</button>
  <button data-v="wheel" onclick="go('wheel')"><span class="i">🎡</span>גלגל המזל</button>
  <button data-v="settings" onclick="openSettings()"><span class="i">⚙️</span>הגדרות</button>
</nav>
<canvas id="fx"></canvas>
<input type="file" id="filepick" accept="image/*" style="display:none">
<input type="file" id="backuppick" accept=".json,application/json" style="display:none">

/* ================== תאריכים ================== */
function pad(n){return String(n).padStart(2,'0')}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayKey(){return keyOf(new Date())}
function dOf(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(k,n){const d=dOf(k);d.setDate(d.getDate()+n);return keyOf(d)}
const fHebM=new Intl.DateTimeFormat('he-u-ca-hebrew',{month:'long'});
const fHebN=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',year:'numeric'});
const HC={};
function heb(k){
 if(HC[k])return HC[k];
 const d=dOf(k);let day=0,year=0;
 fHebN.formatToParts(d).forEach(p=>{if(p.type==='day')day=parseInt(p.value);if(p.type==='year')year=parseInt(p.value)});
 let month=fHebM.format(d).replace(/^ב/,'');
 return HC[k]={day,year,month};
}
function gem(n){
 const H=['','ק','ר','ש','ת'],T=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],U=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
 let s='';while(n>=400){s+='ת';n-=400}if(n>=100){s+=H[Math.floor(n/100)];n%=100}
 if(n===15)s+='טו';else if(n===16)s+='טז';else s+=T[Math.floor(n/10)]+U[n%10];
 return s.length===1?s+'׳':s.slice(0,-1)+'״'+s.slice(-1);
}
const hebDay=k=>gem(heb(k).day);
const hebYear=y=>gem(y%1000);
function hebFull(k){const h=heb(k);return hebDay(k)+' '+h.month+' '+hebYear(h.year)}
const WD=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function gregStr(k){const d=dOf(k);return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()}

const kid=id=>S.children.find(c=>c.id===id);
function rec(k,cid){return (S.records[k]&&S.records[k][cid])||[]}
function setRec(k,cid,arr){S.records[k]=S.records[k]||{};S.records[k][cid]=arr;if(!arr.length)delete S.records[k][cid];if(!Object.keys(S.records[k]).length)delete S.records[k]}
function completions(cid){let n=0;for(const k in S.records){const a=S.records[k][cid];if(a)n+=a.length}return n}
function points(c){return completions(c.id)+(c.bonusPoints||0)}
function every(c){return Math.max(1,parseInt(c.rewardEvery)||10)}
function pendingPrizes(c){return Math.max(0,Math.floor(points(c)/every(c))-(c.prizesGiven||[]).length)}
function dayDone(c,k){const r=rec(k,c.id);return c.tasks.filter(t=>r.includes(t.id)).length}
function isPerfect(c,k){return c.tasks.length>0&&dayDone(c,k)>=c.tasks.length}
function g(c,str){ // החלפת {name} ו-{זכר/נקבה}
 return String(str).replace(/\{name\}/g,c?c.name:'').replace(/\{([^{}\/]*)\/([^{}]*)\}/g,(m,a,b)=>c&&c.gender==='f'?b:a);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function streak(c){
 let k=todayKey(),n=0;
 if(!isPerfect(c,k))k=addDays(k,-1);
 while(isPerfect(c,k)&&n<1000){n++;k=addDays(k,-1)}
 return n;
}

/* ---------- גלילה ימינה ---------- */
function bindSwipes(){
 document.querySelectorAll('.task').forEach(el=>{
  const face=el.querySelector('.face');let sx=0,sy=0,dx=0,active=false,lock=null;
  const start=e=>{if(e.target.closest('button'))return;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;dx=0;active=true;lock=null;face.classList.add('drag');unlockAudio()};
  const move=e=>{if(!active)return;const p=e.touches?e.touches[0]:e;const x=p.clientX-sx,y=p.clientY-sy;
   if(lock===null&&(Math.abs(x)>8||Math.abs(y)>8))lock=Math.abs(x)>Math.abs(y)?'x':'y';
   if(lock!=='x')return; if(e.cancelable)e.preventDefault();
   dx=Math.max(0,x);face.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`};
  const end=()=>{if(!active)return;active=false;face.classList.remove('drag');
   if(dx>el.offsetWidth*0.33){face.style.transform=`translateX(${el.offsetWidth}px)`;setTimeout(()=>completeTask(el.dataset.t),180)}
   else face.style.transform='';};
  el.addEventListener('touchstart',start,{passive:true});el.addEventListener('touchmove',move,{passive:false});el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
  el.addEventListener('mousedown',start);el.addEventListener('mousemove',move);el.addEventListener('mouseup',end);el.addEventListener('mouseleave',end);
 });
}

 if(!wasPerfect&&isPerfect(c,k)){c.autoTokenDays=c.autoTokenDays||{};if(!c.autoTokenDays[k]){c.autoTokenDays[k]=1;c.spinTokens=(c.spinTokens||0)+1;gotToken=true}}

 const crossed=Math.floor(points(c)/every(c))>Math.floor(before/every(c));

function vWheel(){
 const c=kid(V.child);

 h+=`<div class="card"><div class="tokens">${c.spinTokens?`🎟️ ל${esc(c.name)} יש ${c.spinTokens} ${c.spinTokens>1?'סיבובים':'סיבוב'}!`:`ל${esc(c.name)} אין כרגע סיבובים`}</div>
  <div class="wheelwrap"><div class="pointer">🔻</div><canvas id="wheel"></canvas><button class="hub" onclick="spin()">סובב!</button></div>
  ${c.spinTokens?`<button class="btn orange block" style="font-size:22px" onclick="spin()">🎡 ${g(c,'{סובב/סובבי}')} את הגלגל!</button>`:
  `<p class="muted" style="text-align:center;font-weight:600">משלימים את כל המשימות ביום ➜ מקבלים סיבוב!<br>או שההורים נותנים בונוס התנהגות 🌟</p><button class="btn purple block" onclick="grantToken('${c.id}')">🌟 בונוס התנהגות (להורים)</button>`}
 </div>`;
 h+=`<div class="card"><h2>מה יש בגלגל?</h2><div class="row wrap" style="gap:6px">${S.wheel.map(w=>`<span class="chip">${w.emoji} ${esc(g(c,w.text))}</span>`).join('')}</div><button class="btn sm gray" style="margin-top:10px" onclick="openSettings('wheel')">✏️ עריכת הגלגל</button></div>`;
 return h;
}
function wheelSegs(){const tot=S.wheel.reduce((a,w)=>a+(+w.w||1),0);let a=0;return S.wheel.map((w,i)=>{const s=a,span=(+w.w||1)/tot*Math.PI*2;a+=span;return {w,i,s,e:a,mid:s+span/2}})}
function drawWheel(){
 const cv=document.getElementById('wheel');if(!cv)return;const c=kid(V.child);
 const sz=cv.clientWidth||320,dpr=window.devicePixelRatio||1;cv.width=sz*dpr;cv.height=sz*dpr;
 const x=cv.getContext('2d');x.scale(dpr,dpr);const R=sz/2;
 x.translate(R,R);x.rotate(wheelRot);
 const segs=wheelSegs();
 if(!segs.length){x.fillStyle='#e2e8f0';x.beginPath();x.arc(0,0,R,0,7);x.fill();return}
 segs.forEach(sg=>{
  x.beginPath();x.moveTo(0,0);x.arc(0,0,R,sg.s,sg.e);x.closePath();
  x.fillStyle=sg.w.color||WHEEL_COLORS[sg.i%WHEEL_COLORS.length];x.fill();
  x.strokeStyle='#fff';x.lineWidth=3;x.stroke();
  x.save();x.rotate(sg.mid);x.textAlign='right';x.textBaseline='middle';x.fillStyle='#fff';
  x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=3;
  const fs=Math.max(10,Math.min(15,R/11));x.font=`800 ${fs}px Rubik,Arial`;
  let t=g(c,sg.w.text);if(t.length>14)t=t.slice(0,13)+'…';
  x.font=`${fs+6}px serif`;x.fillText(sg.w.emoji||'',R-10,0);
  x.font=`800 ${fs}px Rubik,Arial`;x.fillText(t,R-38,0);
  x.restore();
 });
}
function spin(){
 const c=kid(V.child);if(spinning||!c)return;
 if(!c.spinTokens){toast('אין סיבובים כרגע – משלימים את כל המשימות 💪');return}
 if(!S.wheel.length){toast('הגלגל ריק – הוסיפו פרסים בהגדרות');return}
 unlockAudio();spinning=true;
 const segs=wheelSegs(),tot=segs.reduce((a,s)=>a+(+s.w.w||1),0);
 let r=Math.random()*tot,pick=segs[0];for(const s of segs){r-=(+s.w.w||1);if(r<=0){pick=s;break}}
 const span=pick.e-pick.s,jit=(Math.random()-.5)*span*0.6;
 const base=-Math.PI/2-(pick.mid+jit);
 let target=base;const TWO=Math.PI*2;
 while(target<wheelRot+TWO*6)target+=TWO;
 const from=wheelRot,dur=5200,t0=performance.now();let lastSeg=-1;
 const segAt=rot=>{let a=((-Math.PI/2-rot)%TWO+TWO)%TWO;return segs.findIndex(s=>a>=s.s&&a<s.e)};
 const step=now=>{
  const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);
  wheelRot=from+(target-from)*e;drawWheel();
  const si=segAt(wheelRot);if(si!==lastSeg){lastSeg=si;tick()}
  if(p<1)requestAnimationFrame(step);else{spinning=false;wheelRot%=TWO;wonWheel(c,pick.w)}
 };
 requestAnimationFrame(step);
}
function wonWheel(c,w){
 c.spinTokens=Math.max(0,(c.spinTokens||0)-1);
 const text=g(c,w.text);
 c.wheelLog=c.wheelLog||[];c.wheelLog.push({date:todayKey(),text,emoji:w.emoji});
 const before=points(c);
 if(w.pts){c.bonusPoints=(c.bonusPoints||0)+(+w.pts)}
 save();
 fireworks(3500);cheer();fanfare();
 setTimeout(()=>speak(g(c,'{name}, {זכית/זכית} ב')+text),800);
 const crossed=Math.floor(points(c)/every(c))>Math.floor(before/every(c));
 modal(`<div class="celebrate"><div class="big">${w.emoji||'🎉'}</div><h3>${esc(g(c,'{זכית/זכית} ב:'))}</h3><div style="font-size:30px;font-weight:800;color:#7c3aed;margin:8px 0">${esc(text)}</div><button class="btn green block" onclick="closeModal()">יששש! 🙌</button></div>`,()=>{render();if(crossed)celebratePrize(c)});
}

let modalAfter=null;
function modal(html,after){
 closeModal(true);modalAfter=after||null;
 const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="modal">${html}</div>`;

function closeModal(silent){const o=document.getElementById('ov');if(o)o.remove();if(!silent&&modalAfter){const f=modalAfter;modalAfter=null;f()}else if(silent)modalAfter=null}

/* ================== קול ================== */
let AC=null;
function unlockAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
document.addEventListener('pointerdown',unlockAudio,{once:false,passive:true});
function noiseBuf(sec){const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function bell(freq,t,dur,vol){ // צליל פעמון/קסילופון נעים
 [[1,1],[2.76,.32],[5.4,.12]].forEach(([m,v])=>{const o=AC.createOscillator(),gn=AC.createGain();o.type='sine';o.frequency.value=freq*m;
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol*v,t+0.005);gn.gain.exponentialRampToValueAtTime(0.0008,t+dur/(m>1?m*0.6:1));
  o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+dur+0.05)});
}
function applause(){ // צליל הצלחה: "וּוּפ" רך + מנגינת פעמונים עולה + נצנוצים
 if(!S.settings.sound)return;unlockAudio();if(!AC)return;
 const t=AC.currentTime+0.02;
 const o=AC.createOscillator(),gn=AC.createGain();o.type='sine';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(950,t+0.14);
 gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(0.18,t+0.03);gn.gain.exponentialRampToValueAtTime(0.001,t+0.18);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+0.2);
 const seq=[[783.99,0.12],[1046.5,0.21],[1318.5,0.30],[1567.98,0.39],[2093,0.50]];
 seq.forEach(([f,d],i)=>bell(f,t+d,i===seq.length-1?1.4:0.7,i===seq.length-1?0.22:0.17));
 [1046.5,1318.5,1567.98].forEach(f=>bell(f,t+0.5,1.2,0.07));
 for(let i=0;i<9;i++)bell(2400+Math.random()*2200,t+0.65+i*0.07+Math.random()*0.03,0.35,0.035);
}
function cheer(){ // חגיגה: מנגינה שמחה + נצנוצים
 if(!S.settings.sound)return;unlockAudio();if(!AC)return;
 const t=AC.currentTime+0.02;
 const mel=[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5,1567.98];
 mel.forEach((f,i)=>bell(f,t+i*0.11,0.6,0.15));
 for(let i=0;i<18;i++)bell(2000+Math.random()*2600,t+0.9+i*0.06,0.4,0.03);
}
function note(freq,t,d,type='triangle',vol=0.22){const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=freq;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+0.02);gn.gain.setValueAtTime(vol,t+d*0.7);gn.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+0.05)}
function fanfare(){
 if(!S.settings.sound)return;unlockAudio();if(!AC)return;
 const t=AC.currentTime+0.05;const C=523.25,E=659.25,G=783.99,C2=1046.5,A=880,F=698.46;
 const seq=[[G,0,.12],[G,.13,.12],[G,.26,.12],[C2,.4,.5],[A,.95,.18],[C2,1.15,.18],[G,1.35,.12],[C2,1.5,.9]];
 seq.forEach(([f,s,d])=>{note(f,t+s,d,'square',0.08);note(f,t+s,d,'triangle',0.2);note(f/2,t+s,d,'triangle',0.1)});
 [C,E,G].forEach(f=>note(f,t+1.5,0.9,'triangle',0.09));
}
function tick(){if(!S.settings.sound||!AC)return;const t=AC.currentTime;note(1500,t,0.03,'square',0.05)}
let heVoice=null;
function loadVoices(){const vs=speechSynthesis.getVoices();heVoice=vs.find(v=>/^he|^iw/i.test(v.lang))||null}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(t){
 if(!S.settings.voice||!('speechSynthesis' in window))return;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[!]+/g,'!'));u.lang='he-IL';if(heVoice)u.voice=heVoice;u.rate=S.settings.rate||1;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}

/* ================== זיקוקים וקונפטי ================== */
const fx=document.getElementById('fx'),fctx=fx.getContext('2d');let parts=[],fxRun=false,fwUntil=0;
function sizeFx(){fx.width=innerWidth*(devicePixelRatio||1);fx.height=innerHeight*(devicePixelRatio||1);fctx.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0)}
addEventListener('resize',sizeFx);sizeFx();
const FXC=['#f87171','#fbbf24','#34d399','#60a5fa','#a78bfa','#f472b6','#facc15','#fff'];
function confetti(n){for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,g:0.35,life:110,c:FXC[i%FXC.length],s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,kind:'c'});runFx()}
function burst(x,y){const c=FXC[Math.floor(Math.random()*FXC.length)];for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.06,life:70+Math.random()*30,c,s:2.6,kind:'f'})}
 if(S.settings.sound&&AC){const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf(0.5);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=500;const gn=AC.createGain();gn.gain.setValueAtTime(0.18,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.3);s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start(t)}}
function fireworks(ms){fwUntil=Math.max(fwUntil,performance.now()+ms);confetti(120);runFx()}
let lastBurst=0;
function runFx(){if(fxRun)return;fxRun=true;
 const loop=now=>{
  fctx.clearRect(0,0,innerWidth,innerHeight);
  if(now<fwUntil&&now-lastBurst>350){lastBurst=now;burst(innerWidth*(0.15+Math.random()*0.7),innerHeight*(0.12+Math.random()*0.35))}
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life--;
   if(p.kind==='c'){p.vx*=0.99;p.r+=p.vr;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.fillStyle=p.c;fctx.globalAlpha=Math.min(1,p.life/30);fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fctx.restore()}
   else{p.vx*=0.98;p.vy*=0.98;fctx.globalAlpha=Math.min(1,p.life/40);fctx.fillStyle=p.c;fctx.beginPath();fctx.arc(p.x,p.y,p.s,0,7);fctx.fill();fctx.globalAlpha=1}
  });
  if(parts.length||now<fwUntil)requestAnimationFrame(loop);else{fxRun=false;fctx.clearRect(0,0,innerWidth,innerHeight)}
 };requestAnimationFrame(loop)}

/* ================== התחלה ================== */
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
